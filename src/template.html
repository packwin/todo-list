<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webpack-template</title>
</head>
<body>
    <div id="header">
        <h1>Todo List!</h1>
    </div>

    <div id="sidebar">
        <div id="proj-list"></div>
        <div id="new-proj">
            <div id="form-new-proj">
                <button id="btn-new-proj-close">Close Form</button>
                <label for="new-proj-title">Title</label>
                <input id="new-proj-title" name="new-proj-title" value="Project Title">
            </div>
            <button id="btn-new-proj">New Project</button>
        </div>
    </div>

    <div id="content">
        <div id="proj-info">
            <h1 id="proj-info-title"></h1>
            <label for="proj-info-desc"></label>
            <input id="proj-info-desc" placeholder="Add a description"></h5>
        </div>
        
        <div id="todo-list-container">
            <div id="todo-list"></div>
            <details id="todo-list-completed" class="hidden">
                <summary>Completed</summary>
            </details>

        </div>
        
        <div id="add-todo">
            <label for="input-new-todo"></label>
            <input id="input-new-todo" type="text" placeholder="Add new todo entry">

            <div id="new-todo-date">
                <button id="btn-new-todo-date">Due Date</button>
                <input id="input-new-todo-date" type="date">
            </div>

            <div id="new-todo-priority">
                <select name="new-todo-priority-select" id="new-todo-priority-select">
                    <option value="" selected disabled hidden>Priority</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="moderate">Moderate</option>
                    <option value="low">Low</option>
                    <option value="none">None</option>
                </select>
            </div>

            <button id="btn-new-todo">Add</button>
        </div>
    </div>

    <div id="footer"></div>
</body>
</html>
