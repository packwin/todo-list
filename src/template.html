<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webpack-template</title>
</head>
<body>
    <div id="header">
        <h1>Todo List!</h1>
    </div>

    <div id="content">
        <div id="projects-selection"></div>
        <div id="selected-proj-info"></div>
        <div id="todos"></div>
    </div>

    <div id="forms">
        <form id="form-new-proj">
            <h3>Add Project</h3>
            <label for="form-proj-title">Title</label>
            <input id="form-proj-title" name="new-proj-title" value="Project Title">
            <label for="form-proj-desc">Description</label>
            <input id="form-proj-desc" name="new-proj-desc" value='This is a project description for the project "Project Title"'>
            <button id="form-btn-add-proj" type="button">Add New Project</button>
        </form>
        
        <form id="form-new-todo" class="form-close">
            <h3>Add Todo</h3>
            <label for="form-todo-title">Title</label>
            <input id="form-todo-title" name="new-todo-title" value="Todo1">
            <label for="form-todo-desc">Description</label>
            <input id="form-todo-desc" name="new-todo-desc" value="Todo1Desc">
            <label for="form-due-date">Due Date</label>
            <input id="form-due-date" name="new-todo-due-date" value="Tomorrow">
            <label for="form-priority">Priority</label>
            <input id="form-priority" name="new-todo-priority" value="Important">
            <button id="form-btn-add-todo" type="button">Add New Todo</button>
        </form>
    </div>
</body>
</html>
