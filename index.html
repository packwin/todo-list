<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo List!</title><script defer="defer" src="main.js"></script></head><body><div id="header"><h1>Todo List!</h1></div><div id="sidebar"><div id="proj-list"></div><div id="new-proj"><div id="form-new-proj"><button id="btn-new-proj-close">✖</button><div id="new-proj-input"><input id="new-proj-title" name="new-proj-title" placeholder="Project Title"></div></div><button id="btn-new-proj">New Project</button></div></div><div id="content"><div id="proj-info"><label for="proj-info-title"></label> <input id="proj-info-title"> <label for="proj-info-desc"></label> <input id="proj-info-desc" placeholder="Add a description"></div><div id="todo-list-container"><div id="todo-list"></div><details id="todo-list-completed-details" class="hidden"><summary>Completed</summary><div id="todo-list-completed"></div></details></div><div id="add-todo"><div id="new-todo-inputs"><label for="input-new-todo"></label> <input id="input-new-todo" placeholder="Add new todo entry"> <label for="input-new-todo-desc"></label> <input id="input-new-todo-desc" placeholder="Add a description"></div><div id="new-todo-date"><button id="btn-new-todo-date">Due Date</button> <input id="input-new-todo-date" type="date"></div><div id="new-todo-priority"><select name="new-todo-priority-select" id="new-todo-priority-select"><option value="" selected="selected" disabled="disabled" hidden>Priority</option><option value="critical">Critical</option><option value="high">High</option><option value="moderate">Moderate</option><option value="low">Low</option><option value="none">None</option></select></div><button id="btn-new-todo">Add</button></div></div><div id="footer"></div></body></html>
